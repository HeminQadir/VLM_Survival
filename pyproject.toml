[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-survival"
version = "0.1.0"
description = "Research scaffolding for CT, clinical data and MedGemma survival prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.6,<2.7", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
medgemma = ["transformers==4.57.1", "peft==0.17.1", "accelerate>=1.2,<2", "sentencepiece>=0.2", "protobuf>=4", "safetensors>=0.4"]
quantization = ["bitsandbytes>=0.45,<0.49"]
ct = ["nibabel>=5.2,<6", "scipy>=1.11,<2"]
evaluation = ["scikit-survival>=0.24,<0.27"]

[tool.setuptools.packages.find]
include = ["vlm_survival*"]
